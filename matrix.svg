    <text x="320" y="-120" class="bright">1<tspan x="320" dy="22">ﾒ</tspan><tspan x="320" dy="22">4</tspan><tspan x="320" dy="22">ﾅ</tspan><tspan x="320" dy="22">0</tspan><tspan x="320" dy="22">ﾖ</tspan><tspan x="320" dy="22">6</tspan><animateTransform attributeName="transform" type="translate" from="0 0" to="0 620" dur="1.9s" repeatCount="indefinite"/></text>

