    <text x="180" y="-180">電<tspan x="180" dy="22">9</tspan><tspan x="180" dy="22">影</tspan><tspan x="180" dy="22">3</tspan><tspan x="180" dy="22">無</tspan><tspan x="180" dy="22">7</tspan><tspan x="180" dy="22">夜</tspan><animateTransform attributeName="transform" type="translate" from="0 0" to="0 650" dur="2.2s" repeatCount="indefinite"/></text>

